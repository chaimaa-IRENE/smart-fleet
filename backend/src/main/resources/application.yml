server:
  port: 8082

spring:
  application:
    name: smartfleet-voice-ai
  datasource:
    url: jdbc:h2:mem:voiceai
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

openai:
  api:
    key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4}
  endpoint: ${OPENAI_ENDPOINT:https://api.openai.com/v1}

jwt:
  secret: ${JWT_SECRET:smartfleet-voice-ai-dev-secret-key-change-in-prod}
  enabled: ${JWT_ENABLED:false}

logging:
  level:
    com.smartfleet.voiceai: DEBUG
